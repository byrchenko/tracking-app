name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Generates the PageProps/LayoutProps helpers that typecheck depends on.
      - run: npx next typegen

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rls:
    name: Row Level Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The suite skips itself cleanly when these secrets are absent, so a fork
      # PR without access to them still gets a green, honest run.
      - run: npm run test:rls
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RLS_TEST_EMAIL_A: ${{ secrets.RLS_TEST_EMAIL_A }}
          RLS_TEST_EMAIL_B: ${{ secrets.RLS_TEST_EMAIL_B }}
          RLS_TEST_PASSWORD: ${{ secrets.RLS_TEST_PASSWORD }}
